<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>외출 준비물 체크 - 맑은 가을날</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbf7, #e8dcc4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a3b32;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(110, 80, 50, 0.12);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #f0e6dc;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: #3b2d24;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8c7868;
            margin-bottom: 18px;
        }

        /* 타이틀 바로 아래에 위치하며 업로드된 사진을 가리키는 영역 */
        .image-banner {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            position: relative;
            background-color: #f3ece4;
        }

        .image-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-banner:hover img {
            transform: scale(1.03);
        }

        /* 항목 추가 입력창 영역 */
        .add-item-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .add-item-box input {
            flex-grow: 1;
            padding: 10px 14px;
            border: 1px solid #dfd0c2;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background-color: #faf7f2;
            color: #4a3b32;
        }

        .add-item-box input:focus {
            border-color: #d97736;
            background-color: #fff;
        }

        .add-btn {
            background-color: #8c7868;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .add-btn:hover {
            background-color: #6e5e51;
        }

        .checklist {
            text-align: left;
            margin-bottom: 16px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            background-color: #faf7f2;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            border: 1px solid #eee4dc;
        }

        .checklist-item:hover {
            background-color: #f3ece4;
            border-color: #dfd0c2;
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: #d97736;
            cursor: pointer;
        }

        .checklist-item label {
            font-size: 1rem;
            cursor: pointer;
            flex-grow: 1;
            user-select: none;
            color: #4a3b32;
            word-break: break-all;
        }

        .checklist-item input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #b0a194;
        }

        /* 개별 삭제 버튼 스타일 */
        .delete-btn {
            background: none;
            border: none;
            color: #b5a495;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 6px;
            border-radius: 6px;
            transition: color 0.2s, background-color 0.2s;
        }

        .delete-btn:hover {
            color: #c62828;
            background-color: #fde8e8;
        }

        /* 하단 버튼 그룹 (준비 확인 & 전체 해제) */
        .button-group {
            display: flex;
            gap: 10px;
        }

        .check-btn {
            flex: 2;
            background-color: #d97736;
            color: white;
            border: none;
            padding: 13px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(217, 119, 54, 0.25);
        }

        .check-btn:hover {
            background-color: #c46529;
        }

        .reset-btn {
            flex: 1;
            background-color: #f0e6dc;
            color: #5c4a3e;
            border: none;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .reset-btn:hover {
            background-color: #e2d3c4;
        }

        .check-btn:active, .reset-btn:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 16px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .success {
            color: #2e7d32;
            background-color: #edf7ed;
            padding: 10px;
            border: 1px solid #c8e6c9;
            animation: fadeIn 0.3s ease-in-out;
        }

        .error {
            color: #c62828;
            background-color: #fde8e8;
            padding: 10px;
            border: 1px solid #f5c6cb;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 타이틀 및 부제목 -->
        <h1>외출 준비물 체크</h1>
        <p class="subtitle">맑은 가을날, 출발 전 빠진 물건이 없는지 확인하세요!</p>

        <!-- 타이틀 바로 아래에 배치된 사용자 생성 사진 영역 -->
        <div class="image-banner">
            <!-- 사용자가 올려주신 이미지를 불러오기 위해 파일명을 photo.png로 지정했습니다. -->
            <img src="photo.png" alt="가을 정원 외출 준비 풍경" onerror="this.src='https://images.unsplash.com/photo-1507783590521-729432653f5d?auto=format&fit=crop&w=800&q=80'">
        </div>

        <!-- 준비물 추가 입력창 -->
        <div class="add-item-box">
            <input type="text" id="newItemInput" placeholder="추가할 준비물을 입력하세요" onkeypress="if(event.key === 'Enter') addItem();">
            <button class="add-btn" onclick="addItem()">추가</button>
        </div>
        
        <!-- 체크리스트 목록 영역 -->
        <div class="checklist" id="checklistContainer">
            <!-- 자바스크립트로 동적 렌더링 -->
        </div>

        <!-- 버튼 그룹 (준비 확인 / 전체 해제) -->
        <div class="button-group">
            <button class="check-btn" onclick="checkPreparation()">준비 확인</button>
            <button class="reset-btn" onclick="resetAll()">전체 해제</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        // 초기 준비물 데이터 배열
        let items = [
            { id: 'phone', text: '📱 휴대전화', checked: false },
            { id: 'wallet', text: '👛 지갑', checked: false },
            { id: 'bottle', text: '🍼 물병', checked: false },
            { id: 'umbrella', text: '☂️ 우산', checked: false }
        ];

        // 화면에 리스트 렌더링하는 함수
        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'checklist-item';
                itemDiv.onclick = (e) => toggleCheckbox(index, e);

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'item-' + index;
                checkbox.checked = item.checked;
                checkbox.onchange = (e) => {
                    items[index].checked = e.target.checked;
                };

                const label = document.createElement('label');
                label.htmlFor = 'item-' + index;
                label.innerText = item.text;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '&times;';
                deleteBtn.title = '삭제';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // 부모 클릭 이벤트 방지
                    deleteItem(index);
                };

                itemDiv.appendChild(checkbox);
                itemDiv.appendChild(label);
                itemDiv.appendChild(deleteBtn);
                container.appendChild(itemDiv);
            });
        }

        // 전체 행 클릭 시 체크박스 토글
        function toggleCheckbox(index, event) {
            if (event.target.tagName !== 'INPUT' && event.target.tagName !== 'BUTTON') {
                items[index].checked = !items[index].checked;
                renderChecklist();
            }
        }

        // 새로운 준비물 추가
        function addItem() {
            const input = document.getElementById('newItemInput');
            const text = input.value.trim();
            if (!text) {
                alert('준비물 내용을 입력해주세요!');
                return;
            }

            items.push({
                id: 'custom-' + Date.now(),
                text: text,
                checked: false
            });

            input.value = '';
            renderChecklist();
            document.getElementById('result').innerHTML = '';
            document.getElementById('result').className = '';
        }

        // 개별 항목 삭제
        function deleteItem(index) {
            items.splice(index, 1);
            renderChecklist();
            document.getElementById('result').innerHTML = '';
            document.getElementById('result').className = '';
        }

        // 전체 해제 버튼 기능
        function resetAll() {
            items.forEach(item => item.checked = false);
            renderChecklist();
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';
            resultDiv.className = '';
        }

        // 준비 완료 검사
        function checkPreparation() {
            const resultDiv = document.getElementById('result');

            if (items.length === 0) {
                resultDiv.className = 'error';
                resultDiv.innerText = '⚠️ 등록된 준비물이 없습니다!';
                return;
            }

            const allChecked = items.every(item => item.checked);

            if (allChecked) {
                resultDiv.className = 'success';
                resultDiv.innerText = '🎉 완벽해요! 즐거운 외출 되세요!';
            } else {
                resultDiv.className = 'error';
                resultDiv.innerText = '⚠️ 아직 챙기지 못한 준비물이 있어요!';
            }
        }

        // 페이지 로드 시 초기 렌더링 실행
        window.onload = renderChecklist;
    </script>

</body>
</html>
