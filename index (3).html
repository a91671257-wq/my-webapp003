<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>외출 준비물 체크</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: #27ae60; /* 초록색 제목 */
        }

        /* 첨부된 이미지 스타일 설정 */
        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 15px 0 6px 0;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        /* 항목 추가 입력 영역 */
        .add-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .add-box input {
            flex-grow: 1;
            padding: 10px 14px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .add-box input:focus {
            border-color: #4a90e2;
        }

        .add-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 0 16px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .add-btn:hover {
            background-color: #27ae60;
        }

        .checklist {
            text-align: left;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f8f9fa;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #e9ecef;
            transition: background-color 0.2s;
        }

        .checklist-item:hover {
            background-color: #f1f3f5;
        }

        .item-left {
            display: flex;
            align-items: center;
            flex-grow: 1;
            cursor: pointer;
            overflow: hidden;
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: #4a90e2;
            cursor: pointer;
        }

        .checklist-item label {
            font-size: 1rem;
            cursor: pointer;
            word-break: break-all;
            user-select: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background-color: #fadbd8;
        }

        .check-btn {
            width: 100%;
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .check-btn:hover {
            background-color: #357abd;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .check-btn:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 16px;
            font-size: 1.05rem;
            font-weight: bold;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success {
            color: #27ae60;
            background-color: #e8f8f5;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #a3e4d7;
            animation: fadeIn 0.3s ease-in-out;
        }

        .error {
            color: #c0392b;
            background-color: #f5b7b133;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #f5b7b1;
            animation: fadeIn 0.3s ease-in-out;
        }

        .empty-msg {
            color: #95a5a6;
            text-align: center;
            padding: 20px 0;
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>외출 준비물 체크</h1>
        <!-- 제목 밑에 첨부된 가로 이미지 삽입 -->
        <img src="watermarked_img_1cxa0e1cxa0e1cxa.png" alt="외출 준비 풍경" class="banner-img">
        <p class="subtitle">필요한 물품을 추가하고 관리해보세요!</p>
        
        <!-- 항목 추가 입력창 -->
        <div class="add-box">
            <input type="text" id="newItemInput" placeholder="추가할 준비물 입력..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addItem()">추가</button>
        </div>

        <!-- 체크리스트 목록 영역 -->
        <div class="checklist" id="checklistContainer">
            <!-- 자바스크립트에 의해 동적으로 렌더링됩니다 -->
        </div>

        <button class="check-btn" onclick="checkPreparation()">준비 확인</button>
        
        <div id="result"></div>
    </div>

    <script>
        // 초기 기본 준비물 데이터
        let items = [
            { id: 1, text: '휴대전화', checked: false },
            { id: 2, text: '지갑', checked: false },
            { id: 3, text: '물병', checked: false },
            { id: 4, text: '우산', checked: false }
        ];

        // 화면에 리스트를 그려주는 함수
        function renderList() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-msg">준비물이 없습니다. 추가해 주세요!</div>';
                return;
            }

            items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'checklist-item';
                
                itemDiv.innerHTML = `
                    <div class="item-left" onclick="toggleItem(${item.id})">
                        <input type="checkbox" id="chk-${item.id}" ${item.checked ? 'checked' : ''} onchange="updateCheckState(${item.id}, this.checked)">
                        <label for="chk-${item.id}">${item.text}</label>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${item.id})" title="삭제">×</button>
                `;
                container.appendChild(itemDiv);
            });
        }

        // 체크박스 상태 변경 업데이트
        function updateCheckState(id, isChecked) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.checked = isChecked;
            }
        }

        // 레이블이나 전체 영역 클릭 시 체크박스 토글
        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked;
                renderList();
            }
        }

        // 새로운 준비물 추가 함수
        function addItem() {
            const input = document.getElementById('newItemInput');
            const text = input.value.trim();

            if (text === '') {
                alert('준비물 이름을 입력해주세요!');
                return;
            }

            const newItem = {
                id: Date.now(), // 고유 ID 생성
                text: text,
                checked: false
            };

            items.push(newItem);
            input.value = '';
            document.getElementById('result').innerHTML = ''; // 결과 메시지 초기화
            renderList();
        }

        // 엔터키 입력 시 추가 기능
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addItem();
            }
        }

        // 준비물 삭제 함수
        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            document.getElementById('result').innerHTML = ''; // 결과 메시지 초기화
            renderList();
        }

        // 준비 확인 버튼 로직
        function checkPreparation() {
            const resultDiv = document.getElementById('result');

            if (items.length === 0) {
                resultDiv.className = 'error';
                resultDiv.innerText = '⚠️ 등록된 준비물이 없습니다!';
                return;
            }

            // 모든 항목이 체크되었는지 검사
            const allChecked = items.every(item => item.checked);

            if (allChecked) {
                resultDiv.className = 'success';
                resultDiv.innerText = '🎉 준비 완료!';
            } else {
                resultDiv.className = 'error';
                resultDiv.innerText = '⚠ 아직 챙기지 못한 준비물이 있어요!';
            }
        }

        // 페이지 로드 시 초기 리스트 렌더링
        renderList();
    </script>

</body>
</html>
